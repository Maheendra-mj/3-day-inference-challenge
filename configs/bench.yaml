# Offline (static-batch) sweep used for the PyTorch baseline and, later, vLLM offline.
model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  dtype: float16          # T4 (sm_75) has no native bf16 -> always fp16
device: cuda:0
results_dir: results
seed: 0
ignore_eos: true          # fixed output length => fair cross-backend comparison
sweep:
  batch_sizes: [1, 4, 16, 32]
  prompt_lens: [128, 512]
  output_lens: [128]
  warmup_iters: 1
  repeat: 3
